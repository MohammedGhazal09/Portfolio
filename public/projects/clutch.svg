<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#3b82f6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
    <linearGradient id="text" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>
  <rect width="1600" height="1000" fill="url(#glow)"/>

  <!-- Floating accent bars -->
  <g opacity="0.25">
    <rect x="120" y="200" width="240" height="6" fill="#60a5fa"/>
    <rect x="120" y="220" width="120" height="6" fill="#a78bfa"/>
    <rect x="1240" y="780" width="240" height="6" fill="#22d3ee"/>
    <rect x="1360" y="800" width="120" height="6" fill="#a78bfa"/>
  </g>

  <!-- Status badge -->
  <g transform="translate(120, 700)">
    <rect width="220" height="44" rx="22" fill="rgba(251,191,36,0.12)" stroke="rgba(251,191,36,0.4)"/>
    <circle cx="22" cy="22" r="5" fill="#fbbf24">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="40" y="29" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="13" font-weight="600" fill="#fbbf24" letter-spacing="2">IN DEVELOPMENT</text>
  </g>

  <!-- Wordmark -->
  <text x="800" y="540" font-family="'Space Grotesk', system-ui, sans-serif" font-size="240" font-weight="800" fill="url(#text)" text-anchor="middle" letter-spacing="-12">CLUTCH</text>

  <!-- Tagline -->
  <text x="800" y="610" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="22" fill="rgba(255,255,255,0.55)" text-anchor="middle" letter-spacing="6">REAL-TIME · MULTIPLAYER · TRIVIA</text>

  <!-- Corner marks -->
  <g stroke="rgba(255,255,255,0.3)" stroke-width="2" fill="none">
    <path d="M 80 80 L 80 130 M 80 80 L 130 80"/>
    <path d="M 1520 80 L 1520 130 M 1520 80 L 1470 80"/>
    <path d="M 80 920 L 80 870 M 80 920 L 130 920"/>
    <path d="M 1520 920 L 1520 870 M 1520 920 L 1470 920"/>
  </g>
</svg>
