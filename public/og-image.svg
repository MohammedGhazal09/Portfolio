<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="g1" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="80%" cy="70%" r="55%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g3" cx="50%" cy="100%" r="40%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="text" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#g1)"/>
  <rect width="1200" height="630" fill="url(#g2)"/>
  <rect width="1200" height="630" fill="url(#g3)"/>

  <!-- Eyebrow -->
  <text x="80" y="120" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="18" fill="rgba(255,255,255,0.55)" letter-spacing="6">PORTFOLIO · 2025</text>

  <!-- Headline -->
  <text x="80" y="280" font-family="'Space Grotesk', system-ui, sans-serif" font-size="120" font-weight="800" fill="#f8fafc" letter-spacing="-6">Mohammed</text>
  <text x="80" y="400" font-family="'Space Grotesk', system-ui, sans-serif" font-size="120" font-weight="800" fill="url(#text)" letter-spacing="-6">Ghazal.</text>

  <!-- Subhead -->
  <text x="80" y="475" font-family="'Inter', system-ui, sans-serif" font-size="32" font-weight="400" fill="rgba(255,255,255,0.7)">Full-Stack MERN Developer · Madinah, KSA</text>

  <!-- Stack pills -->
  <g font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="14" letter-spacing="2" fill="rgba(255,255,255,0.85)">
    <g transform="translate(80, 525)">
      <rect width="100" height="34" rx="17" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)"/>
      <text x="50" y="22" text-anchor="middle">REACT</text>
    </g>
    <g transform="translate(192, 525)">
      <rect width="116" height="34" rx="17" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)"/>
      <text x="58" y="22" text-anchor="middle">TYPESCRIPT</text>
    </g>
    <g transform="translate(320, 525)">
      <rect width="100" height="34" rx="17" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)"/>
      <text x="50" y="22" text-anchor="middle">NODE.JS</text>
    </g>
    <g transform="translate(432, 525)">
      <rect width="116" height="34" rx="17" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)"/>
      <text x="58" y="22" text-anchor="middle">MONGODB</text>
    </g>
    <g transform="translate(560, 525)">
      <rect width="100" height="34" rx="17" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)"/>
      <text x="50" y="22" text-anchor="middle">EXPRESS</text>
    </g>
  </g>

  <!-- Big monogram top right -->
  <g transform="translate(900, 80)">
    <rect width="220" height="220" rx="40" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)"/>
    <text x="110" y="160" font-family="'Space Grotesk', system-ui, sans-serif" font-size="160" font-weight="800" fill="url(#text)" text-anchor="middle" letter-spacing="-8">MG</text>
  </g>

  <!-- Status dot -->
  <g transform="translate(1100, 60)">
    <circle r="6" fill="#34d399"/>
    <circle r="10" fill="rgba(52,211,153,0.3)"/>
  </g>
  <text x="1080" y="68" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="12" fill="rgba(255,255,255,0.7)" text-anchor="end" letter-spacing="3">AVAILABLE</text>

  <!-- Corner marks -->
  <g stroke="rgba(255,255,255,0.25)" stroke-width="2" fill="none">
    <path d="M 40 40 L 40 80 M 40 40 L 80 40"/>
    <path d="M 1160 590 L 1160 550 M 1160 590 L 1120 590"/>
  </g>

  <!-- URL strip -->
  <text x="80" y="600" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="14" fill="rgba(255,255,255,0.4)" letter-spacing="3">github.com/MohammedGhazal09 · @MohammedGhazal09</text>
</svg>
